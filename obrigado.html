<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Obrigado! - Reis Craft</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    background:#0a0012;
    color:#fff;
    font-family:'Press Start 2P',monospace;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
    text-align:center;
    image-rendering:pixelated
}
.container{
    max-width:500px;
    width:100%
}
.obelisco{
    font-size:80px;
    margin-bottom:20px;
    display:block
}
h1{
    color:#ffd700;
    font-size:18px;
    margin-bottom:20px;
    text-shadow:0 0 20px rgba(255,215,0,.5),0 0 40px rgba(255,215,0,.2)
}
p{
    color:#d0b0ff;
    font-size:10px;
    line-height:2;
    margin-bottom:30px
}
.status-box{
    background:rgba(170,0,255,.1);
    border:1px solid rgba(170,0,255,.3);
    border-radius:8px;
    padding:20px;
    margin-bottom:30px
}
.status-box .label{
    color:#b388ff;
    font-size:8px;
    margin-bottom:10px
}
.status-box .value{
    color:#ffd700;
    font-size:14px;
    text-shadow:0 0 10px rgba(255,215,0,.4)
}
.btn-voltar{
    display:inline-block;
    font-family:'Press Start 2P',monospace;
    font-size:10px;
    color:#fff5d6;
    background:linear-gradient(0deg,#b8860b,#daa520,#ffd700,#daa520,#b8860b);
    padding:12px 24px;
    text-decoration:none;
    box-shadow:inset -2px -2px 0 #8b6914,inset 2px 2px 0 #ffe44d,0 4px 0 #8b6914,0 6px 10px rgba(0,0,0,.6);
    text-shadow:0 0 8px rgba(255,215,0,.5),1px 1px 0 #3a2500,-1px -1px 0 #3a2500,1px -1px 0 #3a2500,-1px 1px 0 #3a2500
}
.btn-voltar:hover{
    background:linear-gradient(0deg,#d4a017,#f0c040,#ffe55a,#f0c040,#d4a017);
    color:#fff;
    text-shadow:0 0 12px rgba(255,215,0,.8)
}
.particles{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    pointer-events:none;
    z-index:-1;
    background:radial-gradient(ellipse at center,rgba(170,0,255,.05) 0%,transparent 70%)
}
</style>
</head>
<body>
<div class="particles"></div>
<div class="container">
<span class="obelisco">🏰</span>
<h1>Pedido Recebido!</h1>
<p>
Seu pagamento está sendo processado.<br>
Assim que for confirmado, seus<br>
benefícios serão liberados no servidor.
</p>
<div class="status-box">
<div class="label">STATUS</div>
<div class="value">⏳ Aguardando confirmação</div>
</div>
<p style="font-size:8px;color:#666">
Entre no servidor e aguarde.<br>
Qualquer dúvida, chame no Discord.
</p>
<a href="index.html" class="btn-voltar">↩ Voltar ao Site</a>
</div>
</body>
</html>
