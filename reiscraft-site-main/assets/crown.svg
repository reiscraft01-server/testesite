<svg viewBox="0 0 64 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="25%" stop-color="#d4af37"/>
      <stop offset="60%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#6b4c0a"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0a0"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6b1a"/>
    </linearGradient>
    <linearGradient id="gemGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6666"/>
      <stop offset="40%" stop-color="#cc2222"/>
      <stop offset="100%" stop-color="#881111"/>
    </linearGradient>
    <radialGradient id="gemShine" cx="0.35" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="rgba(255,255,255,.6)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="shadowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,.15)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,.4)"/>
    </linearGradient>
  </defs>

  <!-- Base band (bottom ring) -->
  <rect x="8" y="32" width="48" height="10" rx="2" fill="url(#goldGrad)" stroke="#6b4c0a" stroke-width="0.5"/>
  <rect x="8" y="32" width="48" height="4" rx="1" fill="url(#goldLight)" opacity="0.4"/>

  <!-- Bottom rim decoration -->
  <rect x="8" y="40" width="48" height="2" rx="1" fill="#6b4c0a" opacity="0.5"/>

  <!-- Left point -->
  <polygon points="12,32 18,10 24,32" fill="url(#goldGrad)" stroke="#6b4c0a" stroke-width="0.5"/>
  <polygon points="14,32 18,14 22,32" fill="url(#goldLight)" opacity="0.3"/>

  <!-- Center point (tallest) -->
  <polygon points="24,32 32,4 40,32" fill="url(#goldGrad)" stroke="#6b4c0a" stroke-width="0.5"/>
  <polygon points="26,32 32,8 38,32" fill="url(#goldLight)" opacity="0.3"/>

  <!-- Right point -->
  <polygon points="40,32 46,10 52,32" fill="url(#goldGrad)" stroke="#6b4c0a" stroke-width="0.5"/>
  <polygon points="42,32 46,14 50,32" fill="url(#goldLight)" opacity="0.3"/>

  <!-- Small decorative dots on points -->
  <circle cx="18" cy="12" r="1.5" fill="#fff0a0"/>
  <circle cx="32" cy="6" r="1.5" fill="#fff0a0"/>
  <circle cx="46" cy="12" r="1.5" fill="#fff0a0"/>

  <!-- Center gem (ruby) -->
  <rect x="27" y="33" width="10" height="7" rx="1.5" fill="url(#gemGrad)" stroke="#550000" stroke-width="0.5"/>
  <rect x="27" y="33" width="10" height="7" rx="1.5" fill="url(#gemShine)"/>

  <!-- Gem highlight line -->
  <rect x="29" y="35" width="3" height="1.5" rx="0.5" fill="rgba(255,255,255,.25)"/>

  <!-- Side gems -->
  <rect x="15" y="34" width="5" height="4" rx="1" fill="url(#gemGrad)" stroke="#550000" stroke-width="0.3"/>
  <rect x="15" y="34" width="5" height="4" rx="1" fill="url(#gemShine)"/>

  <rect x="44" y="34" width="5" height="4" rx="1" fill="url(#gemGrad)" stroke="#550000" stroke-width="0.3"/>
  <rect x="44" y="34" width="5" height="4" rx="1" fill="url(#gemShine)"/>

  <!-- Shadow overlay at base -->
  <rect x="8" y="38" width="48" height="4" rx="1" fill="url(#shadowGrad)" opacity="0.3"/>
</svg>
