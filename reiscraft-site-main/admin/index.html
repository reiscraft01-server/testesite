<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Reis Craft</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="admin-header">
  <h1>🏰 Painel Reis Craft</h1>
  <p>Gerenciamento de pedidos e entregas</p>
</div>

<div class="stats">
  <div class="stat-card">
    <div class="stat-value" id="stat-total">0</div>
    <div class="stat-label">📦 Total Pedidos</div>
  </div>
  <div class="stat-card">
    <div class="stat-value" id="stat-pendentes">0</div>
    <div class="stat-label">⏳ Pendentes</div>
  </div>
  <div class="stat-card">
    <div class="stat-value" id="stat-receita">$0.00</div>
    <div class="stat-label">💰 Receita Total</div>
  </div>
  <div class="stat-card">
    <div class="stat-value" id="stat-homes-pend">0</div>
    <div class="stat-label">🏠 Homes Pendentes</div>
  </div>
  <div class="stat-card">
    <div class="stat-value" id="stat-desban-pend">0</div>
    <div class="stat-label">🔓 Desban Pendentes</div>
  </div>
</div>

<div class="filtros">
  <button class="ativo" onclick="definirFiltro('todos')">📋 Todos</button>
  <button onclick="definirFiltro('pendentes')">⏳ Pendentes</button>
  <button onclick="definirFiltro('concluidos')">✅ Concluídos</button>
</div>

<div class="tabela-wrapper">
  <table id="orders-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Data</th>
        <th>Nickname</th>
        <th>Produtos</th>
        <th>Valor</th>
        <th>Status</th>
        <th>Homes</th>
        <th>Desban</th>
        <th>Tebex</th>
      </tr>
    </thead>
    <tbody>
      <tr><td colspan="9" class="loading">⏳ Carregando pedidos...</td></tr>
    </tbody>
  </table>
</div>

<script src="admin.js"></script>
</body>
</html>
